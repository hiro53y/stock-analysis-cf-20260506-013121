name = "stock-analysis-cf"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# ──────────────────────────────────────────
# CPU 時間制限について
# Cloudflare Workers Free プラン: 10ms CPU/リクエスト
# Workers Paid (Standard):       50ms CPU/リクエスト
# ※ ネットワーク I/O（Yahoo Finance 取得）は CPU 時間に含まれない
# ※ TypeScript 分析コア（線形回帰・Walk-forward検証）は実測で数 ms 程度の見込み
# ※ 無料枠で動かない場合は Cloudflare ダッシュボードから Paid プランへ移行してください
# ──────────────────────────────────────────

# ──────────────────────────────────────────
# KV Namespace バインディング
# デプロイ前に以下の手順で KV Namespace を作成してください:
#   npx wrangler kv namespace create "ANALYSIS_KV"
#   npx wrangler kv namespace create "ANALYSIS_KV" --preview
# 返ってきた id / preview_id をここに記入します。
# ──────────────────────────────────────────
[[kv_namespaces]]
binding = "ANALYSIS_KV"
id = "0ee91096fe0044799873ea4612a49507"
preview_id = "0ee91096fe0044799873ea4612a49507"
